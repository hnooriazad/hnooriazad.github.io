<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>showcase-check</title></head>
<body><pre id="out">…</pre><div id="stage"></div>
<script>
function load(u,w,h){return new Promise(r=>{const f=document.createElement('iframe');f.width=w;f.height=h||800;f.src=u;f.onload=()=>setTimeout(()=>r(f),900);document.getElementById('stage').appendChild(f);});}
(async()=>{
 const out=[];
 // functional pass at desktop
 const f=await load('/showcase/index.html',1440,900), d=f.contentDocument, de=d.documentElement;
 const W=de.clientWidth;
 const offenders=[...d.querySelectorAll('body *')].map(e=>{const r=e.getBoundingClientRect();
   return {tag:e.tagName+'.'+(e.className||''), right:Math.round(r.right), left:Math.round(r.left), txt:(e.textContent||'').trim().slice(0,30)};})
   .filter(o=>o.right>W+1||o.left<-1).slice(0,10);
 out.push({pass:'desktop 1440', scrollW:de.scrollWidth, W, overflow:de.scrollWidth-W, offenders});
 // scripts loaded?
 const hasGsap=d.defaultView.gsap!==undefined, hasST=d.defaultView.ScrollTrigger!==undefined;
 const canvases=d.querySelectorAll('#gl canvas').length;
 const pFill=d.getElementById('pbarFill');
 out.push({scripts:{gsap:hasGsap, ScrollTrigger:hasST}, canvasCreated:canvases, pbarExists:!!pFill});
 // scroll midway: pin/track should alter transforms
 f.contentWindow.scrollTo(0,1200);
 await new Promise(r=>setTimeout(r,700));
 const stState=(d.defaultView.ScrollTrigger&&d.defaultView.ScrollTrigger.getAll()||[]).length;
 out.push({afterMidScroll:{triggers:stState, scrollY:f.contentWindow.scrollY}});
 f.remove();
 // mobile
 const m=await load('/showcase/index.html',390,844); const md=m.contentDocument.documentElement;
 out.push({pass:'mobile 390', scrollW:md.scrollWidth, W:md.clientWidth, overflow:md.scrollWidth-md.clientWidth});
 m.remove();
 document.getElementById('out').textContent=JSON.stringify(out,null,1);
})();
</script></body></html>
