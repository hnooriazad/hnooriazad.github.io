<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>OG image source — render at 1200×630</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; background: #07090e; }
  .og {
    position: relative; width: 1200px; height: 630px; box-sizing: border-box;
    padding: 78px 84px; display: flex; flex-direction: column; justify-content: space-between;
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background:
      radial-gradient(46% 62% at 12% 18%, rgba(90,167,255,.20), transparent 68%),
      radial-gradient(42% 56% at 92% 6%, rgba(87,226,176,.16), transparent 70%),
      #07090e;
    color: #e9eef8;
  }
  .og::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, #000 5%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, #000 5%, transparent 78%);
    pointer-events: none;
  }
  .og__top { display: flex; align-items: center; gap: 20px; position: relative; z-index: 1; }
  .og__mark {
    width: 74px; height: 74px; border-radius: 20px; display: grid; place-items: center;
    font-size: 1.6rem; font-weight: 700; color: #06121a;
    background: linear-gradient(140deg, #5aa7ff, #57e2b0);
  }
  .og__name { font-size: 2.05rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .og__role { font-size: 1.05rem; color: #8b96ab; margin-top: 6px; }
  .og__mid { position: relative; z-index: 1; }
  .og__title {
    font-size: 4.15rem; font-weight: 700; line-height: 1.16; letter-spacing: -.025em; max-width: 900px;
  }
  .og__title .g {
    background: linear-gradient(100deg, #5aa7ff, #57e2b0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .og__bottom {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    position: relative; z-index: 1; padding-top: 26px; border-top: 1px solid rgba(255,255,255,.10);
    font-size: 1.02rem; color: #8b96ab;
  }
  .og__stack { display: flex; gap: 10px; }
  .og__stack span {
    padding: 7px 15px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px;
    font-size: .92rem; color: #b9c3d4;
  }
  .og__domain { font-family: ui-monospace, Consolas, monospace; color: #5aa7ff; font-size: 1rem; }
</style>
</head>
<body>
  <div class="og">
    <div class="og__top">
      <div class="og__mark">HN</div>
      <div>
        <div class="og__name">Hossein NooriAzad</div>
        <div class="og__role">Senior Software Engineer · .NET Tech Lead</div>
      </div>
    </div>

    <div class="og__mid">
      <div class="og__title">Backends that<br><span class="g">scale.</span></div>
    </div>

    <div class="og__bottom">
      <div class="og__stack">
        <span>C#</span><span>.NET</span><span>Microservices</span><span>SQL Server</span><span>Redis</span>
      </div>
      <div class="og__domain">nooriazad.ir</div>
    </div>
  </div>
</body>
</html>
