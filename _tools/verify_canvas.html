<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>canvas-check</title></head>
<body><pre id="out">…</pre><div id="stage"></div>
<script>
window.onerror = (m,src,l,c)=>{ errors.push(m+' @'+src.split('/').pop()+':'+l); return false; };
const errors=[];
function load(u,w,h){return new Promise(r=>{const f=document.createElement('iframe');f.width=w;f.height=h||800;f.src=u;f.onload=()=>setTimeout(()=>r(f),1400);document.getElementById('stage').appendChild(f);});}
(async()=>{
 const f=await load('/showcase/index.html',1440,900);
 const d=f.contentDocument, win=f.contentWindow;
 await new Promise(r=>setTimeout(r,1600));
 const res={
  errors: errors.slice(),
  canvas: d.querySelectorAll('#gl canvas').length,
  hostVisible: !!d.getElementById('gl'),
  glChildCount: d.getElementById('gl')?.childElementCount
 };
 document.getElementById('out').textContent=JSON.stringify(res,null,1);
 f.remove();
})();
</script></body></html>
