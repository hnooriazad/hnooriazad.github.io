<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحه پیدا نشد | حسین نوری‌آزاد</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .wrap { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .code {
    font-family: var(--mono); font-size: clamp(4rem, 16vw, 9rem); font-weight: 700; line-height: 1;
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent; direction: ltr;
  }
  h1 { margin-top: 8px; font-size: clamp(1.1rem, 3vw, 1.5rem); }
  p { color: var(--muted); margin-top: 10px; max-width: 42ch; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="code">404</div>
      <h1>این صفحه وجود ندارد</h1>
      <p>ممکن است آدرس اشتباه تایپ شده باشد یا صفحه جابه‌جا شده باشد.</p>
      <div class="hero__cta" style="justify-content:center">
        <a class="btn btn--primary" href="/">بازگشت به صفحه اصلی</a>
        <a class="btn btn--ghost" href="/en/" hreflang="en" lang="en">English</a>
      </div>
    </div>
  </div>
</body>
</html>
